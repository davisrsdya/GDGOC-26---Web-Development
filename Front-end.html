<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Front-End | Davis`s Portofolio</title>
    <link rel="stylesheet" href="detail.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <script src="detail.js" defer></script>
</head>
<body>
    <main class="detail-section">

        <div class="page-heading">
            <p class="tulisan">SKILLS / FRONT-END</p>
            <h1>FRONT-END</h1>
            <p>Things I've built with programming Front-End.</p>
        </div>

        <div class="detail-container">

            <section class="projects-panel">

                <div class="panel-heading">
                    <h2>FEATURED PROJECTS</h2>
                    <span id="project-count">03 PROJECTS</span>
                </div>

                <div class="project-list" id="project-list"></div>

            </section>


            <!-- BAGIAN KANAN: TECH STACK -->
            <aside class="stack-panel">

                <h2>TECH STACK</h2>

                <div class="stack-list">

                    <button class="tech-btn active"
                        data-tech="html"
                        aria-pressed="true">

                        <i class="devicon-html5-plain colored"></i>
                        <span>HTML</span>
                        <b>→</b>

                    </button>

                    <button class="tech-btn"
                        data-tech="css"
                        aria-pressed="false">

                        <i class="devicon-css-plain colored"></i>
                        <span>CSS</span>
                        <b>→</b>

                    </button>

                    <button class="tech-btn"
                        data-tech="javascript"
                        aria-pressed="false">

                        <i class="devicon-javascript-plain colored"></i>
                        <span>JavaScript</span>
                        <b>→</b>

                    </button>

                </div>

            </aside>

        </div>

        <a href="index.html" class="back-home">
            ← BACK TO HOME
        </a>

    </main>
</body>
</html>
