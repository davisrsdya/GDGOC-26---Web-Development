<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Languages | Davis`s Portofolio</title>
    <link rel="stylesheet" href="detail.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <script src="detail.js" defer></script>
</head>
<body>
    <main class="detail-section">

        <div class="page-heading">
            <p class="tulisan">SKILLS / LANGUAGES</p>
            <h1>LANGUAGES</h1>
            <p>Things I've built with programming languages.</p>
        </div>

        <div class="detail-container">

            <section class="projects-panel">

                <div class="panel-heading">
                    <h2>FEATURED PROJECTS</h2>
                    <span id="project-count">03 PROJECTS</span>
                </div>

                <div class="project-list" id="project-list"></div>

            </section>

            <aside class="stack-panel">

                <h2>TECH STACK</h2>

                <div class="stack-list">

                    <button class="tech-btn active"
                        data-tech="java"
                        aria-pressed="true">

                        <i class="devicon-java-plain colored"></i>
                        <span>Java</span>
                        <b>→</b>

                    </button>

                    <button class="tech-btn"
                        data-tech="python"
                        aria-pressed="false">

                        <i class="devicon-python-plain colored"></i>
                        <span>Python</span>
                        <b>→</b>

                    </button>

                    <button class="tech-btn"
                        data-tech="csharp"
                        aria-pressed="false">

                        <i class="devicon-csharp-plain colored"></i>
                        <span>C#</span>
                        <b>→</b>

                    </button>

                    <button class="tech-btn"
                        data-tech="cpp"
                        aria-pressed="false">

                        <i class="devicon-cplusplus-plain colored"></i>
                        <span>C++</span>
                        <b>→</b>

                    </button>

                </div>

            </aside>

        </div>

        <a href="index.html" class="back-home">
            ← BACK TO HOME
        </a>

    </main>
