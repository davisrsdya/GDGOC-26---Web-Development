<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tools | Davis`s Portofolio</title>
    <link rel="stylesheet" href="detail.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@latest/devicon.min.css">
    <script src="detail.js" defer></script>
</head>
<body>
    <main class="detail-section">

        <div class="page-heading">
            <p class="tulisan">SKILLS / TOOLS</p>
            <h1>TOOLS</h1>
            <p>Things I've built with cool tools.</p>
        </div>

        <div class="detail-container">

            <section class="projects-panel">

                <div class="panel-heading">
                    <h2>FEATURED PROJECTS</h2>
                    <span id="project-count">03 PROJECTS</span>
                </div>

                <div class="project-list" id="project-list"></div>

            </section>


            <!-- BAGIAN KANAN: TECH STACK -->
            <aside class="stack-panel">

                <h2>TECH STACK</h2>

                <div class="stack-list">

                    <button class="tech-btn active"
                        data-tech="git"
                        aria-pressed="true">

                        <i class="devicon-git-plain colored"></i>
                        <span>Git</span>
                        <b>→</b>

                    </button>

                    <button class="tech-btn"
                        data-tech="github"
                        aria-pressed="false">

                        <i class="devicon-github-original"></i>
                        <span>Github</span>
                        <b>→</b>

                    </button>

                    <button class="tech-btn"
                        data-tech="vscode"
                        aria-pressed="false">

                        <i class="devicon-vscode-plain colored"></i>
                        <span>VS CODE</span>
                        <b>→</b>

                    </button>

                    <button class="tech-btn"
                        data-tech="netlify"
                        aria-pressed="false">

                        <i class="devicon-netlify-plain colored"></i>
                        <span>Netlify</span>
                        <b>→</b>

                    </button>

                    <button class="tech-btn"
                        data-tech="unity"
                        aria-pressed="false">

                        <i class="devicon-unity-plain"></i>
                        <span>Unity</span>
                        <b>→</b>

                    </button>

                </div>

            </aside>

        </div>

        <a href="index.html" class="back-home">
            ← BACK TO HOME
        </a>

    </main>
</body>
</html>
